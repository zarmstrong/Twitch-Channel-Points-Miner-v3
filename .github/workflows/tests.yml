name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Pull requests that only touch documentation skip the jobs below. The
  # required checks still report: a skipped job counts as passing. Matrix
  # jobs skip their steps instead, since a skipped matrix job reports under
  # its unexpanded name and never satisfies "Python 3.x".
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Check for changes outside documentation
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # Pushes to master and manual runs always test everything.
          if [ -z "${PR_NUMBER}" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Include a rename's old path so moving code into a .md still runs CI.
          files=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" \
            --jq '.[] | .filename, (.previous_filename // empty)')
          if [ -z "${files}" ]; then
            # Don't treat an unexpected empty list as docs-only.
            echo "No changed files reported; running everything."
            code=true
          else
            code=false
            while IFS= read -r file; do
              case "${file}" in
                *.md | LICENSE | .git-blame-ignore-revs | .vscode/* | \
                  .github/ISSUE_TEMPLATE/* | .github/FUNDING.yml | .github/stale.yml | .github/dependabot.yml) ;;
                *)
                  echo "Code change: ${file}"
                  code=true
                  break
                  ;;
              esac
            done <<< "${files}"
          fi
          echo "code=${code}" >> "$GITHUB_OUTPUT"

  release_issue_automation:
    name: Release issue automation
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Run release issue automation tests
        run: |
          node .github/scripts/release-linked-issues.test.js
          node .github/scripts/release-pull-links.test.js

  black:
    name: Black
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      # Installs the Black version pinned in requirements-dev.txt;
      # pyproject.toml's required-version rejects any other major version.
      - name: Install Black
        run: python -m pip install "$(grep '^black==' requirements-dev.txt)"

      - name: Check formatting
        run: python -m black --check --diff .

  pytest:
    name: Python ${{ matrix.python-version }}
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Skip for documentation-only changes
        if: needs.changes.outputs.code == 'false'
        run: echo "Only documentation changed; skipping tests."

      - name: Checkout source
        if: needs.changes.outputs.code != 'false'
        uses: actions/checkout@v7

      - name: Set up Python
        if: needs.changes.outputs.code != 'false'
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies
        if: needs.changes.outputs.code != 'false'
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        if: needs.changes.outputs.code != 'false'
        run: python -m pytest

  build_windows_exe:
    name: Build Windows executable (${{ matrix.flavor }})
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        flavor: [standard, portable]

    steps:
      # On pull_request events, actions/checkout defaults to github.sha,
      # which is GitHub's ephemeral merge-preview commit (this branch
      # merged into the base branch) rather than the branch's own head
      # commit - baking that transient SHA into commit_hash.txt below would
      # show a hash that doesn't correspond to any real commit. Pin to the
      # PR's actual head commit instead (falls back to github.sha for
      # non-PR triggers, e.g. push to master or workflow_dispatch).
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      # Confirmed root cause of a 10-15+ minute "Smoke-test Windows
      # executable" hang: merely pip-installing Pillow (a new, unsigned
      # compiled DLL landing in site-packages) is enough to trigger it -
      # even a build that never bundles Pillow into the exe at all still
      # hung. Excluding only the checkout dir (an earlier attempt) didn't
      # help, because the DLL never lands there - it's under Python's own
      # install directory. Exclude that too, plus pip's cache, so nothing
      # written during dependency install or the build gets queued for
      # Defender's real-time/cloud scan. Ephemeral runner, lifetime of this
      # job only.
      - name: Exclude workspace and Python installs from Windows Defender scanning
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath "${{ github.workspace }}"
          Add-MpPreference -ExclusionPath (Split-Path (python -c "import sys; print(sys.executable)"))
          Add-MpPreference -ExclusionPath "$env:LOCALAPPDATA\pip"

      - name: Install build dependencies
        shell: pwsh
        # $ErrorActionPreference only governs terminating (PowerShell-native)
        # errors; a failing external command like `pip install` just sets
        # $LASTEXITCODE and lets the script continue by default, so a
        # mid-script pip failure was previously masked by a later pip
        # command's success - stop after each line explicitly instead.
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw "pip upgrade failed" }
          python -m pip install -r requirements-windows.txt
          if ($LASTEXITCODE -ne 0) { throw "requirements-windows.txt install failed" }
          python -m pip install validators==0.22.0 pyinstaller==6.21.0
          if ($LASTEXITCODE -ne 0) { throw "validators/pyinstaller install failed" }

      - name: Build Windows executable
        shell: cmd
        # Use setup-python's interpreter; the py launcher would pick the
        # newest Python on the runner, which doesn't have PyInstaller.
        env:
          PYINSTALLER_PYTHON: python
        run: build_windows.bat ${{ matrix.flavor }}

      - name: Smoke-test Windows executable
        shell: pwsh
        env:
          FLAVOR: ${{ matrix.flavor }}
        run: |
          $exeName = if ($env:FLAVOR -eq "standard") { "TwitchChannelPointsMiner.exe" } else { "TwitchChannelPointsMiner-Portable.exe" }
          # --windowed is a GUI-subsystem exe, so a plain call here returns
          # before the process actually finishes and leaves $LASTEXITCODE
          # stale/empty; Start-Process -Wait is needed to block on it and
          # get its real exit code.
          $proc = Start-Process -FilePath "dist\$exeName" -ArgumentList "--self-test" -Wait -PassThru
          if ($proc.ExitCode -ne 0) {
            throw "Smoke test failed (exit code $($proc.ExitCode)) - the built exe is missing a GUI dependency"
          }

      - name: Upload built executable
        uses: actions/upload-artifact@v7
        with:
          name: windows-exe-${{ matrix.flavor }}
          path: dist/TwitchChannelPointsMiner*.exe
          if-no-files-found: error

  windows_installer:
    name: Windows installer
    needs: [changes, build_windows_exe]
    # Without an explicit if, a failed build skips this job, and a skipped
    # required check counts as passing. Run it and fail here instead.
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: windows-latest

    steps:
      - name: Require both Windows executables
        if: needs.build_windows_exe.result != 'success'
        env:
          BUILD_RESULT: ${{ needs.build_windows_exe.result }}
        shell: pwsh
        run: |
          Write-Output "::error::Build Windows executable finished as $env:BUILD_RESULT"
          exit 1

      - name: Checkout source
        uses: actions/checkout@v7

      - name: Download standard executable
        uses: actions/download-artifact@v8
        with:
          name: windows-exe-standard
          path: dist

      - name: Download portable executable
        uses: actions/download-artifact@v8
        with:
          name: windows-exe-portable
          path: dist

      - name: Build Windows installer
        shell: pwsh
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) {
            choco install innosetup --no-progress --yes
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }
          if (-not (Test-Path $compiler)) {
            throw "Inno Setup compiler was not found at $compiler after installation"
          }
          & $compiler "/DMyAppVersion=0.0.0-pr${{ github.event.pull_request.number || github.run_number }}" "windows_installer.iss"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer-${{ github.event.pull_request.number || github.run_number }}
          path: |
            dist/TwitchChannelPointsMiner.exe
            dist/TwitchChannelPointsMiner-Portable.exe
            dist/TwitchChannelPointsMiner-0.0.0-pr${{ github.event.pull_request.number || github.run_number }}-Setup.exe
          if-no-files-found: error
