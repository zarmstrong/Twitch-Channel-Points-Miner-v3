name: Mark issues awaiting release

on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  mark_issues:
    name: Mark linked issues
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout automation
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Mark linked issues awaiting release
        uses: actions/github-script@v8
        with:
          script: |
            const automation = require('./.github/scripts/release-linked-issues.js');
            await automation.markIssuesAwaitingRelease({ github, context, core });
