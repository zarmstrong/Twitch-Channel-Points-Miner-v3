name: Mark issues awaiting release

on:
  # A merge, including one from a fork PR, is a push to the default branch,
  # which receives a write token without pull_request_target.
  push:
    branches:
      - master

permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  mark_issues:
    name: Mark linked issues
    runs-on: ubuntu-latest
    steps:
      - name: Checkout automation
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Mark linked issues awaiting release
        uses: actions/github-script@v9
        with:
          script: |
            const automation = require('./.github/scripts/release-linked-issues.js');
            await automation.markIssuesAwaitingRelease({ github, context, core });
