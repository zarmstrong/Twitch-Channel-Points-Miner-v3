name: GitHub Clone Count Update Everyday

on:
  schedule:
    - cron: "0 */24 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-traffic-badges
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Fetch the latest clone counts
        env:
          GH_TOKEN: ${{ secrets.SECRET_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: gh api "repos/$REPOSITORY/traffic/clones" > clone.json

      - name: Download the previous counts from the gist
        env:
          GH_TOKEN: ${{ secrets.SECRET_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
        run: |
          if [ -z "$GIST_ID" ]; then
            echo "::error::GIST_ID is not configured. Create a gist and add its ID as the GIST_ID repository secret."
            exit 1
          fi
          gh api "gists/$GIST_ID" --jq '
            .files["clone.json"]
            | if . == null then error("the gist has no clone.json; check the GIST_ID secret")
              elif .truncated then error("clone.json is too large to read through the API")
              else .content end' > clone_before.json

      - name: Merge the counts
        run: python3 .github/scripts/merge_traffic_counts.py clones clone.json clone_before.json

      - name: Update the gist with the latest counts
        env:
          GH_TOKEN: ${{ secrets.SECRET_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
          REPOSITORY: ${{ github.repository }}
        run: |
          jq -n \
            --arg description "$REPOSITORY clone statistics" \
            --rawfile content clone.json \
            '{description: $description, files: {"clone.json": {content: $content}}}' \
            | gh api --method PATCH "gists/$GIST_ID" --input - > /dev/null
