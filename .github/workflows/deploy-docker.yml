name: Publish Docker image

on:
  workflow_call:
    inputs:
      ref:
        description: Bare SemVer release tag to publish (for example, 3.9.0)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: Bare SemVer release tag to publish (for example, 3.9.0)
        required: true
        type: string
      rebuild:
        description: Build and push the image again even if this version is already on Docker Hub
        required: false
        type: boolean
        default: false

permissions:
  contents: write

env:
  DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || 'zacharmstrong' }}

jobs:
  deploy-docker:
    name: Deploy Docker Hub
    runs-on: ubuntu-latest
    steps:
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.ref }}
        shell: bash
        run: |
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! "${RELEASE_TAG}" =~ ${semver} ]]; then
            echo "::error::ref must be a bare SemVer release tag such as 3.9.0"
            exit 1
          fi

      - name: Checkout source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.DOCKERHUB_NAMESPACE }}/twitch-channel-points-miner
            ${{ env.DOCKERHUB_NAMESPACE }}/twitch-channel-points-miner-v2
          # latest is moved after the push, only for the newest stable
          # release. metadata-action's default (latest=auto) would add it to
          # every stable version, including an older one published again.
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.ref }}

      # A version tag that's already pushed isn't built again: a retry after
      # a later step failed (latest, description, notes) would otherwise
      # replace the published image with a different build. When only one
      # repository has it, it's copied to the other instead. Only a "not
      # found" answer counts as missing; any other registry error fails the
      # job, and a later run retries.
      - name: Check whether this version is already pushed
        id: existing
        env:
          RELEASE_TAG: ${{ inputs.ref }}
          REBUILD: ${{ inputs.rebuild }}
        shell: bash
        run: |
          set -uo pipefail
          primary="${DOCKERHUB_NAMESPACE}/twitch-channel-points-miner:${RELEASE_TAG}"
          legacy="${DOCKERHUB_NAMESPACE}/twitch-channel-points-miner-v2:${RELEASE_TAG}"
          if [[ "${REBUILD}" == "true" ]]; then
            echo "Rebuilding ${RELEASE_TAG} as requested"
            echo "pushed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          image_state() {
            local output
            if output="$(docker buildx imagetools inspect "$1" 2>&1)"; then
              echo pushed
            elif [[ "${output}" == *": not found"* ]]; then
              echo missing
            else
              echo "::error::Could not check whether $1 is on Docker Hub: ${output%%$'\n'*}" >&2
              return 1
            fi
          }
          primary_state="$(image_state "${primary}")" || exit 1
          legacy_state="$(image_state "${legacy}")" || exit 1
          pushed=true
          if [[ "${primary_state}" == missing && "${legacy_state}" == missing ]]; then
            pushed=false
          elif [[ "${primary_state}" == missing ]]; then
            docker buildx imagetools create --tag "${primary}" "${legacy}" || exit 1
          elif [[ "${legacy_state}" == missing ]]; then
            docker buildx imagetools create --tag "${legacy}" "${primary}" || exit 1
          fi
          echo "Version ${RELEASE_TAG} already pushed: ${pushed}"
          echo "pushed=${pushed}" >> "${GITHUB_OUTPUT}"

      - name: Build and push AMD64 and ARM64
        if: steps.existing.outputs.pushed != 'true'
        id: docker_build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Checked out after the build, so it isn't part of the build context.
      # A manually published older release doesn't have these scripts.
      - name: Checkout release automation
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: automation
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Decide whether latest moves
        id: latest
        uses: actions/github-script@v9
        env:
          RELEASE_TAG: ${{ inputs.ref }}
        with:
          script: |
            const automation = require('./automation/.github/scripts/docker-latest-tag.js');
            await automation.decideLatestTag({
              github,
              context,
              core,
              tag: process.env.RELEASE_TAG,
            });

      # Decided right before retagging, so a newer release published while
      # this image was building keeps latest.
      - name: Point latest at this release
        if: steps.latest.outputs.move_latest == 'true'
        env:
          RELEASE_TAG: ${{ inputs.ref }}
        shell: bash
        run: |
          set -euo pipefail
          for image in \
            "${DOCKERHUB_NAMESPACE}/twitch-channel-points-miner" \
            "${DOCKERHUB_NAMESPACE}/twitch-channel-points-miner-v2"; do
            docker buildx imagetools create --tag "${image}:latest" "${image}:${RELEASE_TAG}"
          done

      # The description is the newest release's DOCKERHUB.md.
      - name: Update Docker Hub description
        if: steps.latest.outputs.move_latest == 'true'
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
          repository: ${{ env.DOCKERHUB_NAMESPACE }}/twitch-channel-points-miner
          short-description: Automatically earn Twitch channel points, claim Drops, and manage predictions.
          readme-filepath: ./DOCKERHUB.md

      # Last, so a GitHub API error here can't stop latest or the Docker Hub
      # description from moving; the image is already pushed by now.
      # Runs only when every step above succeeded: release-resolve.js reads
      # the Docker block as "Docker publishing finished", so a release whose
      # latest or description update failed stays unfinished and a later
      # failed or re-run release run publishes it again.
      - name: Add Docker image to GitHub release notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.ref }}
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          image="${DOCKERHUB_NAMESPACE}/twitch-channel-points-miner"

          notes_file=$(mktemp)
          error_file=$(mktemp)
          trap 'rm -f "${notes_file}" "${error_file}"' EXIT

          # Only a missing release (HTTP 404) skips the notes. Auth,
          # rate-limit, server and network errors fail the step instead of
          # passing as "no release". One REST call, so no other lookup's
          # "not found" can stand in for its error, as with gh release view.
          if ! release_notes=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq '.body // ""' 2>"${error_file}"); then
            if grep -q '(HTTP 404)' "${error_file}"; then
              echo "No GitHub release found for ${RELEASE_TAG}; skipping release notes update."
              exit 0
            fi
            echo "::error::Could not read GitHub release ${RELEASE_TAG}: $(cat "${error_file}")"
            exit 1
          fi

          release_notes=$(printf '%s\n' "${release_notes}" | sed '/<!-- docker-image:start -->/,/<!-- docker-image:end -->/d')
          docker_notes=$(cat <<EOF
          <!-- docker-image:start -->
          ### Docker image

          * [\`${image}:${version}\`](https://hub.docker.com/r/${image}/tags?name=${version})

          \`\`\`bash
          docker pull ${image}:${version}
          \`\`\`
          <!-- docker-image:end -->
          EOF
          )
          printf '%s\n\n%s\n' "${release_notes}" "${docker_notes}" > "${notes_file}"
          gh release edit "${RELEASE_TAG}" --notes-file "${notes_file}"

      - name: Image digest AMD64 and ARM64
        run: echo ${{ steps.docker_build.outputs.digest }}
