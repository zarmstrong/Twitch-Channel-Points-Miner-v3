name: GitHub Traffic Count Update Everyday

on:
  schedule:
    - cron: "0 */24 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-traffic-badges
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Fetch the latest view counts
        env:
          GH_TOKEN: ${{ secrets.SECRET_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: gh api "repos/$REPOSITORY/traffic/views" > traffic.json

      - name: Download the previous counts from the gist
        env:
          GH_TOKEN: ${{ secrets.SECRET_TOKEN }}
          TRAFFIC_ID: ${{ secrets.TRAFFIC_ID }}
        run: |
          if [ -z "$TRAFFIC_ID" ]; then
            echo "::error::TRAFFIC_ID is not configured. Create a gist and add its ID as the TRAFFIC_ID repository secret."
            exit 1
          fi
          gh api "gists/$TRAFFIC_ID" --jq '
            .files["traffic.json"]
            | if . == null then error("the gist has no traffic.json; check the TRAFFIC_ID secret")
              elif .truncated then error("traffic.json is too large to read through the API")
              else .content end' > traffic_before.json

      - name: Merge the counts
        run: python3 .github/scripts/merge_traffic_counts.py views traffic.json traffic_before.json

      - name: Update the gist with the latest counts
        env:
          GH_TOKEN: ${{ secrets.SECRET_TOKEN }}
          TRAFFIC_ID: ${{ secrets.TRAFFIC_ID }}
          REPOSITORY: ${{ github.repository }}
        run: |
          jq -n \
            --arg description "$REPOSITORY traffic statistics" \
            --rawfile content traffic.json \
            '{description: $description, files: {"traffic.json": {content: $content}}}' \
            | gh api --method PATCH "gists/$TRAFFIC_ID" --input - > /dev/null
